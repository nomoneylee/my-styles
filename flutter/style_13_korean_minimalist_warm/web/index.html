<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓系奶油甜點 Korean Minimalist Warm - 共用 UI 元件展示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">韓系奶油 KOREAN WARM</h1>
      <button class="icon-btn" aria-label="蛋糕圖示">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5B52" stroke-width="2"><path d="M20 21v-8a2 2 0 00-2-2H6a2 2 0 00-2 2v8"/><path d="M4 16h16"/><path d="M12 11V3"/></svg>
      </button>
    </header>

    <main class="app-content">
      <section class="hero-section">
        <h2 class="display-title">溫柔奶油 UI 元件</h2>
        <p class="body-subtext">燕麥暖棕、奶油黃與軟萌大膠囊質感。</p>
      </section>

      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5B52" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" class="search-input" placeholder="搜尋甜點或韓系咖啡館...">
      </div>

      <div class="segmented-control">
        <button class="segment-btn active">甜點</button>
        <button class="segment-btn">咖啡</button>
        <button class="segment-btn">空間</button>
      </div>

      <section class="component-section">
        <h3 class="section-title">1. 按鈕變體 (Buttons)</h3>
        <div class="button-wrap">
          <button class="btn btn-oat">Warm Oat</button>
          <button class="btn btn-cream">Creamy Yellow</button>
          <button class="btn btn-outlined">Outlined Pill</button>
          <button class="btn btn-text">Text Link</button>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">2. 輸入與選擇 (Inputs)</h3>
        <div class="input-group">
          <label for="kr-input" class="input-label">CAFE_NAME</label>
          <input type="text" id="kr-input" class="text-input" value="Korean Creamy Cafe 2026">
        </div>

        <div class="card kr-card">
          <div class="control-row">
            <span class="control-label">微糖低脂 (Switch)</span>
            <label class="switch">
              <input type="checkbox" id="kr-switch" checked>
              <span class="slider-toggle"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-row">
            <span class="control-label">內用座位預約 (Checkbox)</span>
            <label class="checkbox-container">
              <input type="checkbox" id="kr-checkbox" checked>
              <span class="checkmark"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-col">
            <div class="slider-header">
              <span class="control-label">奶泡甜度 (Slider)</span>
              <span class="slider-value-text" id="slider-val-text">75%</span>
            </div>
            <input type="range" id="sample-slider" class="range-slider" min="0" max="100" value="75">
          </div>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">3. 卡片與視圖 (Cards)</h3>
        <div class="card kr-card">
          <div class="card-header">
            <span class="card-title">草莓鮮奶油草莓塔</span>
            <span class="badge badge-mint">SWEET</span>
          </div>
          <p class="progress-label" id="progress-val-text">烘焙進度: 75%</p>
          <div class="progress-bar">
            <div class="progress-fill progress-fill-75" id="progress-fill"></div>
          </div>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">4. 彈窗與回饋 (Modals)</h3>
        <div class="button-row">
          <button class="btn btn-oat btn-half" id="dialog-trigger-btn">ALERT DIALOG</button>
          <button class="btn btn-outlined btn-half" id="sheet-trigger-btn">BOTTOM SHEET</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active">甜點</button>
      <button class="nav-item">飲品</button>
      <button class="nav-item">收藏</button>
    </nav>

    <div class="modal-overlay hidden" id="sample-dialog">
      <div class="modal-box kr-modal">
        <h3 class="modal-title">🍰 韓系甜點通知</h3>
        <p class="modal-content">奶油溫柔風格大圓角 Alert Dialog 元件。</p>
        <div class="modal-actions">
          <button class="btn btn-oat" id="dialog-close">享用甜點</button>
        </div>
      </div>
    </div>

    <div class="sheet-overlay hidden" id="sample-sheet">
      <div class="sheet-box kr-sheet">
        <h3 class="sheet-title">☕ 韓系奶油選單 (Bottom Sheet)</h3>
        <p class="sheet-desc">極致療癒溫暖質感 Bottom Sheet 面板。</p>
        <button class="btn btn-cream btn-full" id="sheet-close">關閉面板</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
