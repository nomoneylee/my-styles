<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柔和有機 Soft Organic - 共用 UI 元件展示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">SOFT ORGANIC</h1>
      <button class="icon-btn" aria-label="SPA圖示">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E5A44" stroke-width="2"><path d="M12 2a10 10 0 0110 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0112 2z"/><path d="M12 6v12"/></svg>
      </button>
    </header>

    <main class="app-content">
      <section class="hero-section">
        <h2 class="display-title">自然共生 UI 元件</h2>
        <p class="body-subtext">大地色調、大膠囊弧形與極致放鬆質感。</p>
      </section>

      <!-- Search Bar -->
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E5A44" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" class="search-input" placeholder="搜尋植物或有機選項...">
      </div>

      <!-- Segmented Control -->
      <div class="segmented-control">
        <button class="segment-btn active">日常</button>
        <button class="segment-btn">植栽</button>
        <button class="segment-btn">紀錄</button>
      </div>

      <!-- 1. Buttons -->
      <section class="component-section">
        <h3 class="section-title">1. 按鈕變體 (Buttons)</h3>
        <div class="button-wrap">
          <button class="btn btn-sage">Forest Green</button>
          <button class="btn btn-terracotta">Terracotta</button>
          <button class="btn btn-outlined">Outlined Pill</button>
          <button class="btn btn-text">Text Link</button>
        </div>
      </section>

      <!-- 2. Inputs & Selection -->
      <section class="component-section">
        <h3 class="section-title">2. 輸入與選擇 (Inputs)</h3>
        <div class="input-group">
          <label for="organic-input" class="input-label">BOTANICAL_NAME</label>
          <input type="text" id="organic-input" class="text-input" value="ORGANIC_BOTANICAL_LIVING">
        </div>

        <div class="card organic-card">
          <div class="control-row">
            <span class="control-label">自動灌溉 (Switch)</span>
            <label class="switch">
              <input type="checkbox" id="organic-switch" checked>
              <span class="slider-toggle"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-row">
            <span class="control-label">有機認證 (Checkbox)</span>
            <label class="checkbox-container">
              <input type="checkbox" id="organic-checkbox" checked>
              <span class="checkmark"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-col">
            <div class="slider-header">
              <span class="control-label">土壤濕度 (Slider)</span>
              <span class="slider-value-text" id="slider-val-text">60%</span>
            </div>
            <input type="range" id="sample-slider" class="range-slider" min="0" max="100" value="60">
          </div>
        </div>
      </section>

      <!-- 3. Cards & Views -->
      <section class="component-section">
        <h3 class="section-title">3. 卡片與視圖 (Cards)</h3>
        <div class="card organic-card">
          <div class="card-header">
            <span class="card-title">龜背竹日常狀態</span>
            <span class="badge badge-sage">HEALTHY</span>
          </div>
          <p class="progress-label" id="progress-val-text">光照補充率: 60%</p>
          <div class="progress-bar">
            <div class="progress-fill progress-fill-60" id="progress-fill"></div>
          </div>
        </div>
      </section>

      <!-- 4. Modals & Overlays -->
      <section class="component-section">
        <h3 class="section-title">4. 彈窗與回饋 (Modals)</h3>
        <div class="button-row">
          <button class="btn btn-sage btn-half" id="dialog-trigger-btn">ALERT DIALOG</button>
          <button class="btn btn-outlined btn-half" id="sheet-trigger-btn">BOTTOM SHEET</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active">首頁</button>
      <button class="nav-item">花園</button>
      <button class="nav-item">設定</button>
    </nav>

    <!-- Dialog -->
    <div class="modal-overlay hidden" id="sample-dialog">
      <div class="modal-box organic-modal">
        <h3 class="modal-title">🌿 自然溫和對話框</h3>
        <p class="modal-content">大地質感大圓角 Alert Dialog 元件。</p>
        <div class="modal-actions">
          <button class="btn btn-sage" id="dialog-close">確認</button>
        </div>
      </div>
    </div>

    <!-- Sheet -->
    <div class="sheet-overlay hidden" id="sample-sheet">
      <div class="sheet-box organic-sheet">
        <h3 class="sheet-title">🍃 有機生活面板 (Bottom Sheet)</h3>
        <p class="sheet-desc">圓潤舒服之彈出式選單與面板。</p>
        <button class="btn btn-terracotta btn-full" id="sheet-close">關閉面板</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
