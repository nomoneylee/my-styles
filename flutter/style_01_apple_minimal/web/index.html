<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡科技風 Apple Minimal - App 展示模擬</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- App Header -->
    <header class="app-header">
      <h1 class="app-title">極簡科技風 Apple Minimal</h1>
      <button class="icon-btn" id="tune-btn" aria-label="設定">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      </button>
    </header>

    <main class="app-content">
      <!-- Hero Section -->
      <section class="hero-section">
        <h2 class="display-title">即時狀態看板</h2>
        <p class="body-subtext">透過極簡留白與圓潤包覆感呈現實時數據資訊。</p>
      </section>

      <!-- Status Card -->
      <div class="card status-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg class="device-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.65-.79 1.1-1.9 1-3.01-.98.04-2.17.65-2.87 1.46-.62.72-1.16 1.87-1.01 2.98 1.1.09 2.23-.55 2.88-1.43z"/></svg>
            <h3 class="card-title">MacBook Pro 16"</h3>
          </div>
          <span class="badge badge-active">Active</span>
        </div>
        <div class="card-body">
          <span class="label">系統效能指標</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 75%;"></div>
          </div>
          <div class="card-footer">
            <span class="metric-text">CPU 負載 75%</span>
            <span class="status-tag">超高效能模式</span>
          </div>
        </div>
      </div>

      <!-- Controls Section -->
      <section class="control-section">
        <h3 class="section-title">設定與控制</h3>
        
        <div class="input-group">
          <label for="device-name" class="input-label">裝置識別名稱</label>
          <input type="text" id="device-name" class="text-input" value="Apple Silicon M3 Max">
        </div>

        <div class="card list-card">
          <div class="list-item">
            <div class="list-item-info">
              <span class="item-title">高速無線網路 (Wi-Fi 6E)</span>
              <span class="item-sub">已連線至 Studio-5G</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="wifi-switch" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="list-item" id="bluetooth-item">
            <div class="list-item-info">
              <span class="item-title">藍牙裝置連接</span>
              <span class="item-sub">AirPods Max 已連線</span>
            </div>
            <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="sync-btn">同步裝置設定</button>
          <button class="btn btn-secondary" id="reset-btn">重置預設值</button>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
