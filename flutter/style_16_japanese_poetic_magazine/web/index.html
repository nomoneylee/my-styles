<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日系幾何雜誌 Japanese Poetic Magazine - 共用 UI 元件展示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">日系雜誌 POETIC MAGAZINE</h1>
      <button class="icon-btn" aria-label="雜誌圖示">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"/></svg>
      </button>
    </header>

    <main class="app-content">
      <section class="hero-section">
        <h2 class="display-title">幾何詩意 UI 元件</h2>
        <p class="body-subtext">淡黃灰紙張、朱紅點綴與極細網格邊框。</p>
      </section>

      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" class="search-input" placeholder="搜尋雜誌特輯或詩意選集...">
      </div>

      <div class="segmented-control">
        <button class="segment-btn active">特輯</button>
        <button class="segment-btn">專欄</button>
        <button class="segment-btn">藝文</button>
      </div>

      <section class="component-section">
        <h3 class="section-title">1. 按鈕變體 (Buttons)</h3>
        <div class="button-wrap">
          <button class="btn btn-red">Vermilion Red</button>
          <button class="btn btn-green">Morandi Green</button>
          <button class="btn btn-outlined">Outlined Line</button>
          <button class="btn btn-text">Text Link</button>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">2. 輸入與選擇 (Inputs)</h3>
        <div class="input-group">
          <label for="poetic-input" class="input-label">MAGAZINE_TITLE</label>
          <input type="text" id="poetic-input" class="text-input" value="POPEYE_POETIC_MAGAZINE_2026">
        </div>

        <div class="card poetic-card">
          <div class="control-row">
            <span class="control-label">直排閱讀模式 (Switch)</span>
            <label class="switch">
              <input type="checkbox" id="poetic-switch" checked>
              <span class="slider-toggle"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-row">
            <span class="control-label">紙本複本訂閱 (Checkbox)</span>
            <label class="checkbox-container">
              <input type="checkbox" id="poetic-checkbox" checked>
              <span class="checkmark"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-col">
            <div class="slider-header">
              <span class="control-label">版面留白率 (Slider)</span>
              <span class="slider-value-text" id="slider-val-text">82%</span>
            </div>
            <input type="range" id="sample-slider" class="range-slider" min="0" max="100" value="82">
          </div>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">3. 卡片與視圖 (Cards)</h3>
        <div class="card poetic-card">
          <div class="card-header">
            <span class="card-title">東京咖啡店筆記 VOL.08</span>
            <span class="badge badge-red">POETIC</span>
          </div>
          <p class="progress-label" id="progress-val-text">閱讀進度: 82%</p>
          <div class="progress-bar">
            <div class="progress-fill progress-fill-82" id="progress-fill"></div>
          </div>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">4. 彈窗與回饋 (Modals)</h3>
        <div class="button-row">
          <button class="btn btn-red btn-half" id="dialog-trigger-btn">ALERT DIALOG</button>
          <button class="btn btn-outlined btn-half" id="sheet-trigger-btn">BOTTOM SHEET</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active">雜誌</button>
      <button class="nav-item">專欄</button>
      <button class="nav-item">作者</button>
    </nav>

    <div class="modal-overlay hidden" id="sample-dialog">
      <div class="modal-box poetic-modal">
        <h3 class="modal-title">📖 日系詩意對話框</h3>
        <p class="modal-content">日系雜誌細線排版與詩意標題對話框。</p>
        <div class="modal-actions">
          <button class="btn btn-red" id="dialog-close">閱讀特輯</button>
        </div>
      </div>
    </div>

    <div class="sheet-overlay hidden" id="sample-sheet">
      <div class="sheet-box poetic-sheet">
        <h3 class="sheet-title">🎋 雜誌專題選單 (Bottom Sheet)</h3>
        <p class="sheet-desc">直排與橫排交錯排版選單視圖。</p>
        <button class="btn btn-green btn-full" id="sheet-close">關閉選單</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
