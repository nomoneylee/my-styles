<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>希臘聖托里尼 Santorini Mediterranean - 共用 UI 元件展示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">地中海風 SANTORINI</h1>
      <button class="icon-btn" aria-label="帆船圖示">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0055B8" stroke-width="2"><path d="M22 18H2l3-7h14l3 7zM12 2v9"/></svg>
      </button>
    </header>

    <main class="app-content">
      <section class="hero-section">
        <h2 class="display-title">藍白海岸 UI 元件</h2>
        <p class="body-subtext">愛琴海蔚藍、陽光金黃與純白建築質感。</p>
      </section>

      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0055B8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" class="search-input" placeholder="搜尋度假 Villa 或島嶼...">
      </div>

      <div class="segmented-control">
        <button class="segment-btn active">度假</button>
        <button class="segment-btn">設施</button>
        <button class="segment-btn">預訂</button>
      </div>

      <section class="component-section">
        <h3 class="section-title">1. 按鈕變體 (Buttons)</h3>
        <div class="button-wrap">
          <button class="btn btn-blue">Ocean Blue</button>
          <button class="btn btn-yellow">Sun Yellow</button>
          <button class="btn btn-outlined">Outlined</button>
          <button class="btn btn-text">Text Link</button>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">2. 輸入與選擇 (Inputs)</h3>
        <div class="input-group">
          <label for="santo-input" class="input-label">RESORT_LOCATION</label>
          <input type="text" id="santo-input" class="text-input" value="Santorini Resort Villa 2026">
        </div>

        <div class="card santo-card">
          <div class="control-row">
            <span class="control-label">海景套房升級 (Switch)</span>
            <label class="switch">
              <input type="checkbox" id="santo-switch" checked>
              <span class="slider-toggle"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-row">
            <span class="control-label">含希臘早餐 (Checkbox)</span>
            <label class="checkbox-container">
              <input type="checkbox" id="santo-checkbox" checked>
              <span class="checkmark"></span>
            </label>
          </div>
          <div class="divider"></div>
          <div class="control-col">
            <div class="slider-header">
              <span class="control-label">陽光曝曬指數 (Slider)</span>
              <span class="slider-value-text" id="slider-val-text">85%</span>
            </div>
            <input type="range" id="sample-slider" class="range-slider" min="0" max="100" value="85">
          </div>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">3. 卡片與視圖 (Cards)</h3>
        <div class="card santo-card">
          <div class="card-header">
            <span class="card-title">伊亞日落觀景套房</span>
            <span class="badge badge-yellow">POPULAR</span>
          </div>
          <p class="progress-label" id="progress-val-text">訂房滿載度: 85%</p>
          <div class="progress-bar">
            <div class="progress-fill progress-fill-85" id="progress-fill"></div>
          </div>
        </div>
      </section>

      <section class="component-section">
        <h3 class="section-title">4. 彈窗與回饋 (Modals)</h3>
        <div class="button-row">
          <button class="btn btn-blue btn-half" id="dialog-trigger-btn">ALERT DIALOG</button>
          <button class="btn btn-outlined btn-half" id="sheet-trigger-btn">BOTTOM SHEET</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active">度假</button>
      <button class="nav-item">探索</button>
      <button class="nav-item">我的</button>
    </nav>

    <div class="modal-overlay hidden" id="sample-dialog">
      <div class="modal-box santo-modal">
        <h3 class="modal-title">🌊 聖托里尼度假通知</h3>
        <p class="modal-content">藍白地中海風美學 Alert Dialog 元件。</p>
        <div class="modal-actions">
          <button class="btn btn-blue" id="dialog-close">確認預訂</button>
        </div>
      </div>
    </div>

    <div class="sheet-overlay hidden" id="sample-sheet">
      <div class="sheet-box santo-sheet">
        <h3 class="sheet-title">☀️ 愛琴海日照選單 (Bottom Sheet)</h3>
        <p class="sheet-desc">清爽藍白海岸風格 Bottom Sheet 選單。</p>
        <button class="btn btn-yellow btn-full" id="sheet-close">關閉面板</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
